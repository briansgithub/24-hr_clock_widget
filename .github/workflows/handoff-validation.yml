name: Handoff validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m py_compile scripts/context_probe.py scripts/compact_check.py scripts/validate_handoffs.py
      - run: python scripts/validate_handoffs.py --quiet

